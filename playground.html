<style>
  :root{
    --bg:#F7EFEA; --bg-raised:#FFFAF7; --bg-sunk:#F1E5DF;
    --line:#E6D5CD; --line-strong:#D4BEB4;
    --ink:#2B1E24; --ink-2:#5E4A52; --ink-3:#735E68;
    --accent:#B4445C; --accent-ink:#FFF8F5; --accent-soft:rgba(180,68,92,.10); --accent-hover:#A03C52;
    --danger:#B5483C;
    --r-sm:8px; --r-md:14px;
    --ease-out:cubic-bezier(.23,1,.32,1);
    --font-display:'Gloock', Georgia, serif;
    --font-body:'Hanken Grotesk', system-ui, sans-serif;
    --mood:#8E6418; --mood-rgb:142,100,24;
  }

  /* mood = a hue for the face, the mood word and a faint wash. Never the page itself. */
  body.mood-happy{ --mood:#8E6418; --mood-rgb:142,100,24; }
  body.mood-excited{ --mood:#B4445C; --mood-rgb:180,68,92; }
  body.mood-naughty{ --mood:#A8487A; --mood-rgb:168,72,122; }
  body.mood-blush{ --mood:#AF4860; --mood-rgb:175,72,96; }
  body.mood-embarrassed{ --mood:#9E4F78; --mood-rgb:158,79,120; }
  body.mood-sad{ --mood:#4C6B99; --mood-rgb:76,107,153; }
  body.mood-sleepy{ --mood:#6D5FA8; --mood-rgb:109,95,168; }
  body.mood-tired{ --mood:#6E6270; --mood-rgb:110,98,112; }
  body.mood-hungry{ --mood:#9A5C20; --mood-rgb:154,92,32; }
  body.mood-mad{ --mood:#B5483C; --mood-rgb:181,72,60; }
  body.mood-irritated{ --mood:#A2532F; --mood-rgb:162,83,47; }
  body.mood-refuse{ --mood:#6E6270; --mood-rgb:110,98,112; }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body{ margin:0; padding:0; min-height:100%; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--font-body); font-size:16px; line-height:1.55;
    min-height:100vh; position:relative; overflow-x:hidden;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(60% 50% at 50% 35%, rgba(var(--mood-rgb), .12), transparent);
  }

  /* ---------------- top bar ---------------- */
  .site-nav{
    position:relative; z-index:3; width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .site-nav .wordmark{
    font-family:var(--font-display); font-size:18px; line-height:1; color:var(--ink); text-decoration:none;
    min-height:44px; display:inline-flex; align-items:center; padding-right:8px;
  }
  .site-nav .links{ display:flex; align-items:center; }
  .site-nav .links a{
    min-height:44px; display:inline-flex; align-items:center; padding:0 8px;
    font-family:var(--font-body); font-weight:500; font-size:14px; color:var(--ink-2); text-decoration:none;
    text-decoration-thickness:1px; text-underline-offset:6px;
    transition:color .2s var(--ease-out);
  }
  .site-nav .links a:last-child{ padding-right:0; }
  @media (hover:hover){ .site-nav .links a:not(.current):hover{ color:var(--ink); } }
  .site-nav .links a.current{ color:var(--ink); text-decoration-line:underline; text-decoration-color:var(--accent); }
  .site-nav a:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }

  /* ---------------- line-art faces ---------------- */
  .lf{ fill:none; stroke:var(--ink); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke; }
  .lf.dot{ stroke-width:6; }
  .lf-outline{ fill:none; stroke:var(--mood); stroke-width:1.5; vector-effect:non-scaling-stroke; transition:stroke .25s var(--ease-out); }
  body{ overflow:hidden; }

  #particle-layer{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:1; }
  @media (prefers-reduced-motion: reduce){ #particle-layer{ display:none; } }
  .floating-particle{
    position:absolute; bottom:-2%; width:4px; height:4px; border-radius:50%; background:var(--c, var(--accent));
    animation-name:float-up; animation-timing-function:linear; animation-fill-mode:forwards; will-change:transform, opacity;
  }
  .floating-particle.heart{ width:10px; height:10px; border-radius:0; background:none; color:var(--c, var(--accent)); }
  .floating-particle.heart svg{ display:block; width:100%; height:100%; }
  @keyframes float-up{
    0%{ transform:translate(0,0); opacity:0; }
    15%{ opacity:var(--peak,.4); } 85%{ opacity:var(--peak,.4); }
    100%{ transform:translate(var(--drift,20px),-104vh); opacity:0; }
  }

  header{
    position:fixed; top:0; left:0; right:0; z-index:3; pointer-events:none;
    padding:8px 16px 0; display:flex; justify-content:center;
  }
  .header-inner{ width:100%; max-width:480px; display:flex; flex-direction:column; align-items:center; text-align:center; }
  .site-nav{ pointer-events:auto; }
  .names{
    font-family:var(--font-display); font-weight:400; font-size:clamp(28px,7vw,40px); line-height:1.1;
    letter-spacing:-0.01em; text-wrap:balance; color:var(--ink); margin:24px 0 0;
  }
  .hint{ margin:8px auto 0; max-width:300px; font-size:15px; line-height:1.5; color:var(--ink-2); text-wrap:balance; }

  /* ---------------- the roaming playground face ---------------- */
  .face-wanderer{
    position:fixed; z-index:2; width:min(34vw,170px);
    --move-dur: 0.6s;
    transition: left var(--move-dur) cubic-bezier(.3,.9,.4,1.15), top var(--move-dur) cubic-bezier(.3,.9,.4,1.15);
    touch-action:none; cursor:pointer; user-select:none;
  }
  .face-wanderer svg{ width:100%; height:auto; display:block; overflow:visible; }
  .face-wanderer .lf-outline{ fill:var(--bg); }
  .face-wanderer .cheek{ fill:var(--accent); opacity:.22; }
  .face-wanderer .cheek.warm{ opacity:.3; }

  @keyframes wander-bounce{
    0%{ transform:scale(1) rotate(0deg); } 35%{ transform:scale(0.95,1.04) rotate(-1deg); }
    70%{ transform:scale(1.04,0.97) rotate(1deg); } 100%{ transform:scale(1) rotate(0deg); }
  }
  @keyframes wander-wiggle{
    0%,100%{ transform:rotate(0deg); } 30%{ transform:rotate(-3deg); } 70%{ transform:rotate(3deg); }
  }
  @keyframes wander-shake{
    0%,100%{ transform:translateX(0) rotate(0deg); }
    25%{ transform:translateX(-4px) rotate(-2deg); } 50%{ transform:translateX(4px) rotate(2deg); }
    75%{ transform:translateX(-3px) rotate(-1deg); }
  }
  /* duck holds low for a beat; each move in and out stays under 400ms */
  @keyframes wander-duck{
    0%{ transform:scale(1) translateY(0); opacity:1; }
    30%{ transform:scale(0.88,0.8) translateY(10px); opacity:.7; }
    70%{ transform:scale(0.88,0.8) translateY(10px); opacity:.7; }
    100%{ transform:scale(1) translateY(0); opacity:1; }
  }
  @keyframes breathe{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.03); } }
  .face-wanderer.bounce svg{ animation:wander-bounce .4s var(--ease-out); }
  .face-wanderer.wiggle svg{ animation:wander-wiggle .4s var(--ease-out); }
  .face-wanderer.shake svg{ animation:wander-shake .4s var(--ease-out); }
  .face-wanderer.duck svg{ animation:wander-duck 1.1s var(--ease-out); }
  body.mood-sleepy .face-wanderer:not(.bounce):not(.wiggle):not(.shake):not(.duck) svg{ animation:breathe 4.5s ease-in-out infinite; }

  .face{ opacity:0; transition:opacity .2s var(--ease-out); }
  .face.active{ opacity:1; }
  .eye-hit, .cheek-hit, .chin-hit, .mouth-hit{ cursor:pointer; }

  .pinch-mark{
    opacity:0; fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.5; vector-effect:non-scaling-stroke;
    transform-box:fill-box; transform-origin:center; transition:opacity .15s var(--ease-out);
  }
  .pinch-mark.active{ opacity:1; animation:pinch-stretch .8s ease-in-out infinite; }
  @keyframes pinch-stretch{ 0%,100%{ transform:scale(1,1); } 50%{ transform:scale(1.25,0.8); } }

  .no-bubble{
    position:absolute; top:-14px; left:50%; transform:translate(-50%,4px);
    background:var(--bg-raised); border:1px solid var(--line); color:var(--ink);
    font-family:var(--font-body); font-weight:500; font-size:14px;
    padding:6px 12px; border-radius:var(--r-sm); white-space:nowrap; opacity:0;
    transition:opacity .2s var(--ease-out), transform .2s var(--ease-out); pointer-events:none; z-index:5;
  }
  .no-bubble.show{ opacity:1; transform:translate(-50%,0); }

  @media (prefers-reduced-motion: reduce){
    .face-wanderer, .face-wanderer svg{ transition:none; animation:none !important; }
    .pinch-mark.active{ animation:none; }
  }
</style>

    function playAnim(cls, dur){
      faceEl.classList.remove('bounce','squish','wiggle','squirm','duck');

      faceEl.classList.add(cls);
      setTimeout(function(){ faceEl.classList.remove(cls); }, dur);

      if (animCls) playAnim(animCls, animDur);
      reactionTimer = setTimeout(showMoodFace, holdDur);

      faceEl.style.setProperty('--move-dur', durSec + 's');
      faceEl.style.left = left + 'px';
      faceEl.style.top = top + 'px';
    }

    function restPosition(){
      var rect = faceEl.getBoundingClientRect();
      var w = rect.width || 170;
      return { left: (window.innerWidth - w) / 2, top: window.innerHeight * 0.4 };

      var pos = restPosition();
      faceEl.style.transition = 'none';
      faceEl.style.left = pos.left + 'px';
      faceEl.style.top = pos.top + 'px';
      void faceEl.offsetWidth;
      faceEl.style.transition = '';
    }

    function moveFaceTo(x, y, fast){
      var rect = faceEl.getBoundingClientRect();
      var w = rect.width || 170, h = rect.height || 170, margin = 10;
      var left = Math.min(Math.max(x - w / 2, margin), window.innerWidth - w - margin);
      var top = Math.min(Math.max(y - h / 2, margin), window.innerHeight - h - margin);
      placeFace(left, top, fast ? 0.3 : 0.65);

    function cheekTapAway(side){
      clearTimeout(reactionTimer);
      setFaceGroup('irritated');
      playAnim('shake', 500);
      var rect = faceEl.getBoundingClientRect();
      var w = rect.width, h = rect.height, margin = 10;
      var awayLeft = side === 'left' ? (window.innerWidth - w - margin) : margin;
      var awayTop = Math.random() < 0.5 ? margin : (window.innerHeight - h - margin);
      placeFace(awayLeft, awayTop, 0.45);
      reactionTimer = setTimeout(showMoodFace, 900);

    function spawnParticle(){

    initialPlacement();

    // ---------------- auth guard + partner lookup ----------------
    var { data: sessionData } = await supabase.auth.getSession();
    var session = sessionData && sessionData.session;
    if (!session){
      window.location.href = 'login.html';
      return;
    }
    var myUserId = session.user.id;

    var { data: myProfile } = await supabase.from('profiles').select('*').eq('user_id', myUserId).maybeSingle();
    if (!myProfile){
      showMoodFace();
      return;
    }

    var { data: partnerProfile } = await supabase.from('profiles').select('*').eq('pair_id', myProfile.pair_id).neq('user_id', myUserId).maybeSingle();
    if (!partnerProfile){
      showMoodFace();
      return;
    }
    document.getElementById('hint').textContent = 'Tap, tickle or pat ' + partnerProfile.display_name + '. The eyes and mouth are off limits.';

    function fetchPartnerMood(){
      if (document.hidden) return; // no polling from a background tab
      supabase.from('mood_state').select('mood').eq('user_id', partnerProfile.user_id).maybeSingle()
        .then(function(res){
          if (res.data && res.data.mood){ applyMoodTheme(res.data.mood); }
        });
    }

    fetchPartnerMood();
    setInterval(fetchPartnerMood, 4000);
  })();
</script>

</body>
</html>
