<style>
  :root{
    --bg:#F7EFEA; --bg-raised:#FFFAF7; --bg-sunk:#F1E5DF;
    --line:#E6D5CD; --line-strong:#D4BEB4;
    --ink:#2B1E24; --ink-2:#5E4A52; --ink-3:#735E68;
    --accent:#B4445C; --accent-ink:#FFF8F5; --accent-soft:rgba(180,68,92,.10); --accent-hover:#A03C52;
    --danger:#B5483C;
    --r-sm:8px; --r-md:14px;
    --ease-out:cubic-bezier(.23,1,.32,1);
    --font-display:'Gloock', Georgia, serif;
    --font-body:'Hanken Grotesk', system-ui, sans-serif;
    --mood:#8E6418; --mood-rgb:142,100,24;
  }

  /* mood = a hue for the face, the mood word and a faint wash. Never the page itself. */
  body.mood-happy{ --mood:#8E6418; --mood-rgb:142,100,24; }
  body.mood-excited{ --mood:#B4445C; --mood-rgb:180,68,92; }
  body.mood-naughty{ --mood:#A8487A; --mood-rgb:168,72,122; }
  body.mood-blush{ --mood:#AF4860; --mood-rgb:175,72,96; }
  body.mood-embarrassed{ --mood:#9E4F78; --mood-rgb:158,79,120; }
  body.mood-sad{ --mood:#4C6B99; --mood-rgb:76,107,153; }
  body.mood-sleepy{ --mood:#6D5FA8; --mood-rgb:109,95,168; }
  body.mood-tired{ --mood:#6E6270; --mood-rgb:110,98,112; }
  body.mood-hungry{ --mood:#9A5C20; --mood-rgb:154,92,32; }
  body.mood-mad{ --mood:#B5483C; --mood-rgb:181,72,60; }
  body.mood-irritated{ --mood:#A2532F; --mood-rgb:162,83,47; }
  body.mood-refuse{ --mood:#6E6270; --mood-rgb:110,98,112; }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body{ margin:0; padding:0; min-height:100%; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--font-body); font-size:16px; line-height:1.55;
    min-height:100vh; position:relative; overflow-x:hidden;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(60% 50% at 50% 35%, rgba(var(--mood-rgb), .12), transparent);
  }

  /* ---------------- top bar ---------------- */
  .site-nav{
    position:relative; z-index:3; width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .site-nav .wordmark{
    font-family:var(--font-display); font-size:18px; line-height:1; color:var(--ink); text-decoration:none;
    min-height:44px; display:inline-flex; align-items:center; padding-right:8px;
  }
  .site-nav .links{ display:flex; align-items:center; }
  .site-nav .links a{
    min-height:44px; display:inline-flex; align-items:center; padding:0 8px;
    font-family:var(--font-body); font-weight:500; font-size:14px; color:var(--ink-2); text-decoration:none;
    text-decoration-thickness:1px; text-underline-offset:6px;
    transition:color .2s var(--ease-out);
  }
  .site-nav .links a:last-child{ padding-right:0; }
  @media (hover:hover){ .site-nav .links a:not(.current):hover{ color:var(--ink); } }
  .site-nav .links a.current{ color:var(--ink); text-decoration-line:underline; text-decoration-color:var(--accent); }
  .site-nav a:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }

  /* ---------------- line-art faces ---------------- */
  .lf{ fill:none; stroke:var(--ink); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke; }
  .lf.dot{ stroke-width:6; }
  .lf-outline{ fill:none; stroke:var(--mood); stroke-width:1.5; vector-effect:non-scaling-stroke; transition:stroke .25s var(--ease-out); }
  .mini-face .mf{ display:none; }
  .mini-face[data-mood="happy"] .mf[data-mood="happy"],
  .mini-face[data-mood="tired"] .mf[data-mood="tired"],
  .mini-face[data-mood="sad"] .mf[data-mood="sad"],
  .mini-face[data-mood="mad"] .mf[data-mood="mad"],
  .mini-face[data-mood="hungry"] .mf[data-mood="hungry"],
  .mini-face[data-mood="sleepy"] .mf[data-mood="sleepy"],
  .mini-face[data-mood="excited"] .mf[data-mood="excited"],
  .mini-face[data-mood="naughty"] .mf[data-mood="naughty"]{ display:inline; }
  .mini-face[data-mood="happy"]{ --mood:#8E6418; }
  .mini-face[data-mood="tired"]{ --mood:#6E6270; }
  .mini-face[data-mood="sad"]{ --mood:#4C6B99; }
  .mini-face[data-mood="mad"]{ --mood:#B5483C; }
  .mini-face[data-mood="hungry"]{ --mood:#9A5C20; }
  .mini-face[data-mood="sleepy"]{ --mood:#6D5FA8; }
  .mini-face[data-mood="excited"]{ --mood:#B4445C; }
  .mini-face[data-mood="naughty"]{ --mood:#A8487A; }
  .mini-face svg{ display:block; width:100%; height:100%; }
  .mini-face .lf{ stroke-width:1.5; }
  .mini-face .lf.dot{ stroke-width:4; }
  body{ display:flex; justify-content:center; }

  .page{
    position:relative; z-index:1; width:100%; max-width:480px;
    padding:8px 16px 48px; display:flex; flex-direction:column; align-items:center;
    opacity:0; transition:opacity .25s var(--ease-out);
  }
  .page.ready{ opacity:1; }

  .hello{ text-align:center; margin:40px 0 8px; display:flex; flex-direction:column; align-items:center; }
  .hello-emoji{ width:64px; height:64px; margin:0 0 16px; }
  h1{
    font-family:var(--font-display); font-weight:400; font-size:clamp(28px,7vw,40px); line-height:1.1;
    letter-spacing:-0.01em; text-wrap:balance; color:var(--ink); margin:0;
  }
  .hello-sub{ margin:8px 0 0; font-size:15px; color:var(--ink-2); }
  .hello-sub:empty{ display:none; }

  .card{
    width:100%; background:var(--bg-raised); border:1px solid var(--line); border-radius:var(--r-md);
    padding:20px; margin-top:16px; scroll-margin-top:24px;
  }
  .card h2{ font-family:var(--font-display); font-weight:400; font-size:20px; line-height:1.2; color:var(--ink); margin:0 0 16px; }

  .field label{ display:block; font-size:13px; font-weight:500; color:var(--ink-2); margin-bottom:6px; }
  .field + .field{ margin-top:16px; }
  .inline-form{ display:flex; gap:8px; }
  input[type="text"]{
    flex:1; min-width:0; min-height:44px; padding:0 12px; border-radius:var(--r-sm); border:1px solid var(--line);
    font-family:var(--font-body); font-size:16px; color:var(--ink); background:var(--bg-sunk);
    transition:border-color .15s var(--ease-out), box-shadow .15s var(--ease-out);
  }
  input[type="text"]::placeholder{ color:var(--ink-3); }
  input[type="text"]:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  #joinCode{ text-transform:uppercase; letter-spacing:.12em; }
  #joinCode::placeholder{ text-transform:none; letter-spacing:0; }
  .readonly{ margin:0; font-size:16px; color:var(--ink); overflow-wrap:anywhere; }
  .field-msg{ margin:8px 0 0; font-size:13px; color:var(--ink-3); }
  .field-msg.error{ color:var(--danger); font-weight:500; }
  .field-msg:empty{ display:none; }

  .btn{
    flex:none; min-height:44px; padding:0 16px; border-radius:var(--r-sm); cursor:pointer;
    font-family:var(--font-body); font-weight:500; font-size:15px;
    border:1px solid var(--line-strong); background:transparent; color:var(--ink);
    transition:background-color .2s var(--ease-out), border-color .2s var(--ease-out), transform .15s var(--ease-out), opacity .2s var(--ease-out);
  }
  .btn.primary{ border-color:var(--accent); background:var(--accent); color:var(--accent-ink); }
  .btn.danger{ color:var(--danger); border-color:rgba(181,72,60,.4); }
  @media (hover:hover){
    .btn:not(.primary):not(:disabled):hover{ border-color:var(--ink-3); }
    .btn.primary:not(:disabled):hover{ background:var(--accent-hover); border-color:var(--accent-hover); }
    .btn.danger:not(:disabled):hover{ background:rgba(181,72,60,.06); border-color:var(--danger); }
  }
  .btn:active{ transform:scale(0.97); }
  .btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .btn:disabled{ opacity:.5; cursor:default; transform:none; }

  .partner-row{ display:flex; align-items:center; gap:16px; }
  .partner-text{ flex:1; min-width:0; }
  .partner-text p{ margin:0; }
  .partner-name{ font-weight:600; font-size:16px; color:var(--ink); }
  .partner-since{ font-size:14px; color:var(--ink-3); margin-top:2px !important; }

  .code-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .invite-code{
    font-family:var(--font-body); font-weight:600; font-size:22px; letter-spacing:.2em; color:var(--ink);
    background:var(--bg-sunk); border:1px dashed var(--line-strong); border-radius:var(--r-sm); padding:6px 14px; user-select:all;
  }
  .help{ margin:8px 0 0; font-size:14px; line-height:1.5; color:var(--ink-3); text-wrap:pretty; }
  .divider{ height:1px; background:var(--line); margin:20px 0; border:none; }

  .account-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .account-actions .btn{ flex:1; }

  [hidden]{ display:none !important; }

  /* ---------------- confirm sheet (native <dialog>) ---------------- */
  .confirm-sheet{
    width:min(360px, calc(100% - 32px)); border:1px solid var(--line); border-radius:var(--r-md); padding:24px 20px 20px;
    background:var(--bg-raised); color:var(--ink); text-align:center; box-shadow:0 24px 48px rgba(43,30,36,.16);
  }
  .confirm-sheet::backdrop{ background:rgba(43,30,36,.4); }
  .confirm-sheet[open]{ animation:sheet-in .22s var(--ease-out); }
  .confirm-sheet[open]::backdrop{ animation:fade-in .22s var(--ease-out); }
  @keyframes sheet-in{ from{ opacity:0; transform:translateY(8px) scale(0.96); } }
  @keyframes fade-in{ from{ opacity:0; } }
  .confirm-emoji{ display:none; }
  .confirm-sheet h3{ margin:0 0 8px; font-family:var(--font-display); font-weight:400; font-size:22px; line-height:1.2; color:var(--ink); text-wrap:balance; }
  .confirm-body{ margin:0; font-size:15px; line-height:1.55; color:var(--ink-2); text-wrap:pretty; }
  .confirm-field{ margin-top:16px; text-align:left; }
  .confirm-field label{ display:block; font-size:13px; font-weight:500; color:var(--ink-2); margin-bottom:6px; }
  .confirm-field input{ width:100%; }
  .confirm-actions{ display:flex; gap:8px; margin-top:20px; }
  .confirm-actions button{
    flex:1; min-height:44px; border-radius:var(--r-sm); cursor:pointer; font:500 15px var(--font-body);
    transition:transform .15s var(--ease-out), opacity .2s var(--ease-out);
  }
  .confirm-actions button:active{ transform:scale(0.97); }
  .confirm-actions button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .confirm-cancel{ border:1px solid var(--line-strong); background:transparent; color:var(--ink); }
  .confirm-go{ border:1px solid var(--danger); background:var(--danger); color:var(--accent-ink); }
  .confirm-go.friendly{ border-color:var(--accent); background:var(--accent); }
  .confirm-go:disabled{ opacity:.45; cursor:not-allowed; transform:none; }
  .confirm-error{ margin:12px 0 0; min-height:16px; font-size:13px; color:var(--danger); }

  @media (prefers-reduced-motion: reduce){
    .confirm-sheet[open], .confirm-sheet[open]::backdrop{ animation:none; }
    .page{ transition:none; }
  }
</style>
</head>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  var SUPABASE_URL = "https://vlkdgcjoxvvebbmnuxht.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZsa2RnY2pveHZ2ZWJibW51eGh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1NTkwODIsImV4cCI6MjEwMDEzNTA4Mn0.dM-b1C9VQjkXOse-r1cHj89T0GxRIGygiIsKx8y50wI";
  var supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var GALLERY_BUCKET = 'gallery-photos';
  var moodEmoji = { happy:'😊', tired:'🥱', sad:'😢', mad:'😠', hungry:'🍙', sleepy:'😴', excited:'🤩', naughty:'😏' };

  var myUserId = null;
  var myProfile = null;
  var partnerProfile = null;
  var pairInfo = null;

  // ---------------- confirm sheet ----------------
  // One native <dialog> shared by every destructive action. opts.run
  // returns an error message to show, or nothing on success.
  var confirmSheet = document.getElementById('confirmSheet');
  var confirmField = document.getElementById('confirmField');
  var confirmInput = document.getElementById('confirmInput');
  var confirmGo = document.getElementById('confirmGo');
  var confirmCancel = document.getElementById('confirmCancel');
  var confirmError = document.getElementById('confirmError');
  var confirmOpts = null;
  var confirmBusy = false;

  function updateConfirmGo(){
    var typed = !confirmOpts.requireText || confirmInput.value.trim().toLowerCase() === confirmOpts.requireText;
    confirmGo.disabled = confirmBusy || !typed;
  }

  function openConfirm(opts){
    confirmOpts = opts;
    confirmBusy = false;
    document.getElementById('confirmEmoji').textContent = opts.emoji;
    document.getElementById('confirmTitle').textContent = opts.title;
    document.getElementById('confirmBody').textContent = opts.body;
    confirmField.hidden = !opts.requireText;
    document.getElementById('confirmInputLabel').textContent = opts.requireText ? 'Type "' + opts.requireText + '" to confirm' : '';
    confirmInput.value = '';
    confirmError.textContent = '';
    confirmGo.textContent = opts.goLabel;
    confirmGo.classList.toggle('friendly', !!opts.friendly);
    updateConfirmGo();
    confirmSheet.showModal();
    (opts.requireText ? confirmInput : confirmCancel).focus();
  }

  confirmInput.addEventListener('input', updateConfirmGo);
  confirmCancel.addEventListener('click', function(){ if (!confirmBusy) confirmSheet.close(); });
  confirmSheet.addEventListener('cancel', function(e){ if (confirmBusy) e.preventDefault(); });
  confirmSheet.addEventListener('click', function(e){ if (e.target === confirmSheet && !confirmBusy) confirmSheet.close(); });

  document.getElementById('confirmForm').addEventListener('submit', async function(e){
    e.preventDefault();
    if (confirmGo.disabled) return;
    confirmBusy = true;
    confirmError.textContent = '';
    confirmGo.textContent = confirmOpts.busyLabel;
    updateConfirmGo();
    var err = await confirmOpts.run();
    if (err){
      confirmBusy = false;
      confirmError.textContent = err;
      confirmGo.textContent = confirmOpts.goLabel;
      updateConfirmGo();
    }
  });

  // ---------------- gallery helpers ----------------
  async function listMyGallery(){
    var { data, error } = await supabase.storage.from(GALLERY_BUCKET).list(myProfile.pair_id, { limit: 100 });
    if (error) return null;
    return (data || []).filter(function(f){ return f.id; });
  }

  // Deletes every file in the caller's pair folder. Returns an error message or nothing.
  async function clearMyGallery(){
    while (true){
      var files = await listMyGallery();
      if (!files) return "Couldn't clear your gallery. Try again?";
      if (!files.length) return;
      var paths = files.map(function(f){ return myProfile.pair_id + '/' + f.name; });
      var { error } = await supabase.storage.from(GALLERY_BUCKET).remove(paths);
      if (error) return "Couldn't clear your gallery. Try again?";
    }
  }

  // ---------------- display name ----------------
  var nameForm = document.getElementById('nameForm');
  var nameInput = document.getElementById('nameInput');
  var nameSave = document.getElementById('nameSave');
  var nameMsg = document.getElementById('nameMsg');

  function setMsg(el, text, isError){
    el.textContent = text || '';
    el.classList.toggle('error', !!isError);
  }

  nameInput.addEventListener('input', function(){
    var v = nameInput.value.trim();
    nameSave.disabled = !v || v === myProfile.display_name;
    setMsg(nameMsg, '');
  });

  nameForm.addEventListener('submit', async function(e){
    e.preventDefault();
    var v = nameInput.value.trim();
    if (!v || v === myProfile.display_name) return;
    nameSave.disabled = true;
    var { error } = await supabase.from('profiles').update({ display_name: v }).eq('user_id', myUserId);
    if (error){
      setMsg(nameMsg, "Couldn't save that name. Try again?", true);
      nameSave.disabled = false;
      return;
    }
    myProfile.display_name = v;
    nameInput.value = v;
    document.getElementById('helloName').textContent = v;
    setMsg(nameMsg, 'Saved.');
  });

  // ---------------- partner: copy code, join, remove ----------------
  var copyCodeBtn = document.getElementById('copyCodeBtn');
  copyCodeBtn.addEventListener('click', async function(){
    try {
      await navigator.clipboard.writeText(pairInfo.invite_code);
      copyCodeBtn.textContent = 'Copied!';
    } catch (e) {
      copyCodeBtn.textContent = 'Select it ↖';
    }
    setTimeout(function(){ copyCodeBtn.textContent = 'Copy'; }, 2000);
  });

  var joinForm = document.getElementById('joinForm');
  var joinCode = document.getElementById('joinCode');
  var joinBtn = document.getElementById('joinBtn');
  var joinMsg = document.getElementById('joinMsg');

  joinCode.addEventListener('input', function(){
    joinBtn.disabled = joinCode.value.trim().length !== 6;
    setMsg(joinMsg, '');
  });

  joinForm.addEventListener('submit', async function(e){
    e.preventDefault();
    var code = joinCode.value.trim().toUpperCase();
    if (code.length !== 6) return;
    joinBtn.disabled = true;
    setMsg(joinMsg, 'Checking that code...');

    // Dry run: validates the code and tells us whose pair it is.
    var { data: theirName, error } = await supabase.rpc('join_pair', { p_invite_code: code, p_dry_run: true });
    joinBtn.disabled = false;
    if (error){
      setMsg(joinMsg, error.message, true);
      return;
    }
    setMsg(joinMsg, '');

    var files = await listMyGallery();
    var photoCount = files ? files.length : 0;
    openConfirm({
      emoji: '💞',
      title: 'Join ' + theirName + '?',
      body: "You'll share " + theirName + "'s date and gallery from now on." +
        (photoCount ? ' The ' + photoCount + (photoCount === 1 ? ' photo' : ' photos') + " in your own gallery will be deleted." : ''),
      friendly: !photoCount,
      goLabel: 'Join ' + theirName,
      busyLabel: 'Joining...',
      run: async function(){
        if (photoCount){
          var clearErr = await clearMyGallery();
          if (clearErr) return clearErr;
        }
        var { error: joinErr } = await supabase.rpc('join_pair', { p_invite_code: code });
        if (joinErr) return joinErr.message;
        window.location.href = 'index.html';
      }
    });
  });

  document.getElementById('removePartnerBtn').addEventListener('click', function(){
    var name = partnerProfile.display_name;
    openConfirm({
      emoji: '💔',
      title: 'Remove ' + name + '?',
      body: "You'll keep your date and your gallery. " + name + " gets unpaired, and your invite code changes so you can pair with someone new.",
      goLabel: 'Remove',
      busyLabel: 'Removing...',
      run: async function(){
        var { error } = await supabase.rpc('remove_partner');
        if (error) return "Couldn't remove your partner. Try again?";
        window.location.reload();
      }
    });
  });

  // ---------------- account ----------------
  document.getElementById('logoutBtn').addEventListener('click', async function(){
    await supabase.auth.signOut();
    window.location.href = 'login.html';
  });

  document.getElementById('deleteAccountBtn').addEventListener('click', function(){
    openConfirm({
      emoji: '🥺',
      title: 'Delete your account?',
      body: partnerProfile
        ? 'Your login and moods are erased for good. ' + partnerProfile.display_name + ' keeps your shared date and photos.'
        : "Your login, moods, and every photo in your gallery are erased for good. This can't be undone.",
      requireText: 'delete',
      goLabel: 'Delete forever',
      busyLabel: 'Deleting...',
      run: async function(){
        // Solo pair: nobody keeps the gallery, so clear the files first (SQL
        // can't delete storage objects). With a partner, the photos stay theirs.
        if (!partnerProfile){
          var clearErr = await clearMyGallery();
          if (clearErr) return clearErr;
        }
        var { error } = await supabase.rpc('delete_my_account');
        if (error) return "Couldn't delete your account. Try again?";
        await supabase.auth.signOut();
        window.location.href = 'login.html';
      }
    });
  });

  // ---------------- boot ----------------
  (async function boot(){
    var { data: sessionData } = await supabase.auth.getSession();
    var session = sessionData && sessionData.session;
    if (!session){
      window.location.href = 'login.html';
      return;
    }
    myUserId = session.user.id;
    document.getElementById('emailText').textContent = session.user.email || '(no email)';

    var { data: profileRow } = await supabase.from('profiles').select('*').eq('user_id', myUserId).maybeSingle();
    if (!profileRow){
      // Account never finished setup; home runs the fallback pairing.
      window.location.href = 'index.html';
      return;
    }
    myProfile = profileRow;

    var [pairRes, partnerRes, moodRes] = await Promise.all([
      supabase.from('pairs').select('*').eq('id', myProfile.pair_id).maybeSingle(),
      supabase.from('profiles').select('*').eq('pair_id', myProfile.pair_id).neq('user_id', myUserId).maybeSingle(),
      supabase.from('mood_state').select('mood').eq('user_id', myUserId).maybeSingle()
    ]);
    pairInfo = pairRes.data;
    partnerProfile = partnerRes.data;

    var mood = moodRes.data && moodEmoji[moodRes.data.mood] ? moodRes.data.mood : 'happy';
    document.body.className = 'mood-' + mood;
    document.getElementById('moodEmoji').dataset.mood = mood;

    document.getElementById('helloName').textContent = myProfile.display_name;
    nameInput.value = myProfile.display_name;

    if (partnerProfile){
      document.getElementById('helloSub').textContent = 'Paired with ' + partnerProfile.display_name;
      document.getElementById('partnerName').textContent = partnerProfile.display_name;
      if (pairInfo){
        var since = new Date(pairInfo.since_date + 'T00:00:00');
        document.getElementById('partnerSince').textContent = 'Together since ' + since.toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' });
      }
      document.getElementById('pairedView').hidden = false;
    } else {
      document.getElementById('helloSub').textContent = 'Not paired yet';
      document.getElementById('inviteCode').textContent = pairInfo ? pairInfo.invite_code : '------';
      document.getElementById('soloView').hidden = false;
    }

    document.getElementById('page').classList.add('ready');
    if (location.hash === '#partner' && !partnerProfile) joinCode.focus();
  })();
</script>

</body>
</html>
