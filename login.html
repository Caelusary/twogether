<style>
  :root{
    --bg:#F7EFEA; --bg-raised:#FFFAF7; --bg-sunk:#F1E5DF;
    --line:#E6D5CD; --line-strong:#D4BEB4;
    --ink:#2B1E24; --ink-2:#5E4A52; --ink-3:#735E68;
    --accent:#B4445C; --accent-ink:#FFF8F5; --accent-soft:rgba(180,68,92,.10); --accent-hover:#A03C52;
    --danger:#B5483C;
    --r-sm:8px; --r-md:14px;
    --ease-out:cubic-bezier(.23,1,.32,1);
    --font-display:'Gloock', Georgia, serif;
    --font-body:'Hanken Grotesk', system-ui, sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body{ margin:0; padding:0; min-height:100%; }
  body{
    background:var(--bg);
    font-family:var(--font-body); font-size:16px; line-height:1.55; color:var(--ink);
    display:flex; justify-content:center; align-items:center;
    min-height:100vh; min-height:100dvh; position:relative; overflow-x:hidden;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(60% 45% at 50% 20%, var(--accent-soft), transparent);
  }

  .card{
    position:relative; z-index:1; width:100%; max-width:380px; margin:32px 16px;
    background:var(--bg-raised); border:1px solid var(--line); border-radius:var(--r-md);
    padding:32px 24px 24px;
  }

  /* brand mark: the line-art face from the playground, small */
  .mark{ display:block; width:40px; height:40px; margin:0 auto 12px; }
  .mark circle.outline{ stroke:var(--accent); stroke-width:1.5; fill:none; }
  .mark .stroke{ stroke:var(--ink); stroke-width:1.5; fill:none; stroke-linecap:round; }
  .mark .eyes{ transform-box:fill-box; transform-origin:center; animation:blink 5s infinite; }
  @keyframes blink{ 0%,94%,100%{ transform:scaleY(1); } 96%{ transform:scaleY(0.1); } }

  h1{
    font-family:var(--font-display); font-weight:400; font-size:clamp(28px,7vw,40px); line-height:1.1;
    letter-spacing:-0.01em; text-wrap:balance; color:var(--ink); margin:0 0 8px; text-align:center;
  }
  .sub{ text-align:center; font-size:15px; color:var(--ink-2); margin:0 0 24px; text-wrap:balance; }

  .tabs{
    display:flex; gap:4px; background:var(--bg-sunk); border:1px solid var(--line); border-radius:var(--r-sm);
    padding:3px; margin-bottom:20px;
  }
  .tab{
    flex:1; min-height:44px; border:1px solid transparent; background:none; border-radius:6px; cursor:pointer;
    font-family:var(--font-body); font-weight:500; font-size:14px; color:var(--ink-3);
    transition:background-color .2s var(--ease-out), color .2s var(--ease-out), border-color .2s var(--ease-out);
  }
  @media (hover:hover){ .tab:not(.active):hover{ color:var(--ink-2); } }
  .tab.active{ background:var(--bg-raised); border-color:var(--line-strong); color:var(--ink); }
  .tab:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  form{ display:none; flex-direction:column; gap:16px; }
  form.active{ display:flex; }
  .field{ display:flex; flex-direction:column; gap:6px; }

  label{ font-size:13px; font-weight:500; color:var(--ink-2); }
  .optional{ font-weight:400; color:var(--ink-3); }
  input{
    width:100%; min-height:44px; padding:0 12px; border-radius:var(--r-sm); border:1px solid var(--line);
    font-family:var(--font-body); font-size:16px; font-weight:400; color:var(--ink); background:var(--bg-sunk);
    transition:border-color .15s var(--ease-out), box-shadow .15s var(--ease-out);
  }
  input::placeholder{ color:var(--ink-3); }
  input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  #signupCode{ text-transform:uppercase; letter-spacing:.12em; }
  #signupCode::placeholder{ text-transform:none; letter-spacing:0; }

  .invite-hint{ font-size:13px; line-height:1.5; color:var(--ink-3); margin:0; text-wrap:pretty; }

  button[type="submit"]{
    margin-top:4px; min-height:48px; border:1px solid var(--line-strong); border-radius:var(--r-sm); cursor:pointer;
    background:transparent; color:var(--ink-2); font-family:var(--font-body); font-weight:500; font-size:16px;
    transition:transform .15s var(--ease-out), opacity .2s var(--ease-out), background-color .2s var(--ease-out), color .2s var(--ease-out), border-color .2s var(--ease-out);
  }
  button[type="submit"].ready{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  @media (hover:hover){ button[type="submit"].ready:hover{ background:var(--accent-hover); } }
  button[type="submit"]:active{ transform:scale(0.97); }
  button[type="submit"]:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  button[type="submit"]:disabled{ opacity:0.6; cursor:default; }

  .msg{ font-size:14px; line-height:1.5; text-align:center; margin:16px 0 0; color:var(--ink-2); }
  .msg:empty{ display:none; }
  .msg.error{ color:var(--danger); font-weight:500; }
  .msg.success{ color:var(--accent); font-weight:500; }

  @media (prefers-reduced-motion: reduce){
    .mark .eyes{ animation:none; }
    .tab, input, button[type="submit"]{ transition:none; }
  }
</style>
</head>
<body>

<div class="card">
  <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
    <circle class="outline" cx="20" cy="20" r="18"/>
    <g class="eyes"><path class="stroke" d="M14 17v2.5M26 17v2.5"/></g>
    <path class="stroke" d="M14.5 25.5 Q20 29.5 25.5 25.5"/>
  </svg>
  <h1>twogether</h1>
  <p class="sub">A little book for the two of you.</p>

  <div class="tabs" role="tablist" aria-label="Log in or sign up">
    <button type="button" class="tab active" id="tabLogin" role="tab" aria-selected="true" aria-controls="loginForm">Log in</button>
    <button type="button" class="tab" id="tabSignup" role="tab" aria-selected="false" aria-controls="signupForm">Sign up</button>
  </div>

  <form id="loginForm" class="active">
    <div class="field">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" autocomplete="current-password" required>
    </div>
    <button type="submit" id="loginSubmit">Log in</button>
  </form>

  <form id="signupForm">
    <div class="field">
      <label for="signupName">Your name</label>
      <input type="text" id="signupName" placeholder="e.g. Alex" autocomplete="given-name" required>
    </div>
    <div class="field">
      <label for="signupEmail">Email</label>
      <input type="email" id="signupEmail" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="signupPassword">Password</label>
      <input type="password" id="signupPassword" autocomplete="new-password" minlength="6" required>
    </div>
    <div class="field">
      <label for="signupCode">Invite code <span class="optional">(optional)</span></label>
      <input type="text" id="signupCode" placeholder="From your partner, if you have one" maxlength="6" autocomplete="off" aria-describedby="inviteHint">
      <p class="invite-hint" id="inviteHint">No code? Leave it blank and you'll get one to share with your partner.</p>
    </div>
    <button type="submit" id="signupSubmit">Create account</button>
  </form>

  <p class="msg" id="msg" role="status"></p>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.117.3?bundle';

  var SUPABASE_URL = "https://vlkdgcjoxvvebbmnuxht.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZsa2RnY2pveHZ2ZWJibW51eGh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1NTkwODIsImV4cCI6MjEwMDEzNTA4Mn0.dM-b1C9VQjkXOse-r1cHj89T0GxRIGygiIsKx8y50wI";
  var supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var tabLogin = document.getElementById('tabLogin');
  var tabSignup = document.getElementById('tabSignup');
  var loginForm = document.getElementById('loginForm');
  var signupForm = document.getElementById('signupForm');
  var msg = document.getElementById('msg');

  function setMsg(text, type){
    msg.textContent = text || '';
    msg.className = 'msg' + (type ? ' ' + type : '');
  }

  function showTab(which){
    var isLogin = which === 'login';
    tabLogin.classList.toggle('active', isLogin);
    tabSignup.classList.toggle('active', !isLogin);
    tabLogin.setAttribute('aria-selected', String(isLogin));
    tabSignup.setAttribute('aria-selected', String(!isLogin));
    loginForm.classList.toggle('active', isLogin);
    signupForm.classList.toggle('active', !isLogin);
    setMsg('');
  }

  function wireReadyState(form, submitBtn){
    function update(){ submitBtn.classList.toggle('ready', form.checkValidity()); }
    form.addEventListener('input', update);
    update();
  }
  wireReadyState(loginForm, document.getElementById('loginSubmit'));
  wireReadyState(signupForm, document.getElementById('signupSubmit'));
  tabLogin.addEventListener('click', function(){ showTab('login'); });
  tabSignup.addEventListener('click', function(){ showTab('signup'); });

  (async function redirectIfLoggedIn(){
    var { data } = await supabase.auth.getSession();
    if (data && data.session){ window.location.href = 'index.html'; }
  })();

  loginForm.addEventListener('submit', async function(e){
    e.preventDefault();
    var email = document.getElementById('loginEmail').value.trim();
    var password = document.getElementById('loginPassword').value;
    var submitBtn = document.getElementById('loginSubmit');
    submitBtn.disabled = true;
    setMsg('Logging in...');

    var { error } = await supabase.auth.signInWithPassword({ email: email, password: password });
    if (error){
      setMsg(error.message, 'error');
      submitBtn.disabled = false;
      return;
    }
    setMsg('Welcome back.', 'success');
    window.location.href = 'index.html';
  });

  signupForm.addEventListener('submit', async function(e){
    e.preventDefault();
    var displayName = document.getElementById('signupName').value.trim();
    var email = document.getElementById('signupEmail').value.trim();
    var password = document.getElementById('signupPassword').value;
    var code = document.getElementById('signupCode').value.trim();
    var submitBtn = document.getElementById('signupSubmit');
    submitBtn.disabled = true;
    setMsg('Creating your account...');

    var { data: signUpData, error: signUpError } = await supabase.auth.signUp({ email: email, password: password });
    if (signUpError){
      setMsg(signUpError.message, 'error');
      submitBtn.disabled = false;
      return;
    }

    if (!signUpData.session){
      setMsg('Check your email to confirm your account, then log in.', 'success');
      submitBtn.disabled = false;
      return;
    }

    var { data: pairId, error: pairError } = await supabase.rpc('create_or_join_pair', {
      p_display_name: displayName,
      p_invite_code: code || null
    });
    if (pairError){
      setMsg(pairError.message, 'error');
      submitBtn.disabled = false;
      return;
    }

    setMsg('You\'re in. Taking you home...', 'success');
    window.location.href = 'index.html';
  });
</script>

</body>
</html>
